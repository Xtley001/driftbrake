[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "driftbrake-py"
version = "0.2.0"
description = "Chain-agnostic pre-flight simulation and drift-based halt guard for simulation-driven trading strategies and MEV searchers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Xtley001" }
]
keywords = ["ethereum", "mev", "trading", "arbitrage", "simulation", "risk-management", "defi"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "driftbrake.driftbrake_rs"
python-source = "python"
