documentation.workspace = true
description = "Chain-agnostic trait boundaries for driftbrake: ProfitDecoder, RealizedProfitDecoder, HaltPolicy, SimEngine. Zero dependency on REVM or alloy — see docs/ARCHITECTURE.md."
