[workspace]
resolver = "2"
members = [
    "core",
    "revm-backend",
    "reconcile",
    "receipt-poller",
    "driftbrake",
    "journal",
    "driftbrake-py",
    "benchmark",
    "examples/toy-arbitrage",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Xtley001/driftbrake"
homepage = "https://github.com/Xtley001/driftbrake"
documentation = "https://docs.rs/driftbrake"
